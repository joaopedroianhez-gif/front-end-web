<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | Formulário Validado</title>
  <link rel="stylesheet" href="global.css">
  <script src="index.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="cabecalho">
      <span class="etiqueta">CADASTRO</span>
      <h1>Crie sua conta</h1>
      <p>Preencha os campos abaixo para realizar seu cadastro.</p>
    </header>

    <form id="formCadastro" novalidate>
      <div class="grid">
        <div class="campo">
          <label for="nome">Nome completo *</label>
          <input type="text" id="nome" name="nome" placeholder="Ex.: João da Silva" required minlength="3">
          <small class="erro"></small>
        </div>

        <div class="campo">
          <label for="email">E-mail *</label>
          <input type="email" id="email" name="email" placeholder="voce@email.com" required>
          <small class="erro"></small>
        </div>

        <div class="campo">
          <label for="cpf">CPF *</label>
          <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" inputmode="numeric" required>
          <small class="erro"></small>
        </div>

        <div class="campo">
          <label for="telefone">Telefone *</label>
          <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" maxlength="15" inputmode="numeric" required>
          <small class="erro"></small>
        </div>

        <div class="campo">
          <label for="nascimento">Data de nascimento *</label>
          <input type="date" id="nascimento" name="nascimento" required>
          <small class="erro"></small>
        </div>

        <div class="campo">
          <label for="sexo">Gênero *</label>
          <select id="sexo" name="sexo" required>
            <option value="">Selecione</option>
            <option value="Feminino">Feminino</option>
            <option value="Masculino">Masculino</option>
            <option value="Outro">Outro</option>
            <option value="Prefiro não informar">Prefiro não informar</option>
          </select>
          <small class="erro"></small>
        </div>

        <div class="campo">
          <label for="cep">CEP *</label>
          <input type="text" id="cep" name="cep" placeholder="00000-000" maxlength="9" inputmode="numeric" required>
          <small class="erro"></small>
        </div>

        <div class="campo">
          <label for="cidade">Cidade *</label>
          <input type="text" id="cidade" name="cidade" placeholder="Sua cidade" required>
          <small class="erro"></small>
        </div>

        <div class="campo">
          <label for="estado">Estado *</label>
          <select id="estado" name="estado" required>
            <option value="">Selecione</option>
            <option>AC</option><option>AL</option><option>AP</option><option>AM</option>
            <option>BA</option><option>CE</option><option>DF</option><option>ES</option>
            <option>GO</option><option>MA</option><option>MT</option><option>MS</option>
            <option>MG</option><option>PA</option><option>PB</option><option>PR</option>
            <option>PE</option><option>PI</option><option>RJ</option><option>RN</option>
            <option>RS</option><option>RO</option><option>RR</option><option>SC</option>
            <option>SP</option><option>SE</option><option>TO</option>
          </select>
          <small class="erro"></small>
        </div>

        <div class="campo">
          <label for="senha">Senha *</label>
          <input type="password" id="senha" name="senha" placeholder="Mínimo de 8 caracteres" required minlength="8">
          <small class="erro"></small>
        </div>

        <div class="campo campo-completo">
          <label for="confirmarSenha">Confirmar senha *</label>
          <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Digite a senha novamente" required>
          <small class="erro"></small>
        </div>
      </div>

      <label class="termos">
        <input type="checkbox" id="termos" name="termos" required>
        <span>Li e aceito os termos de uso e a política de privacidade. *</span>
      </label>
      <small class="erro erro-termos"></small>

      <button type="submit" id="botaoEnviar">Finalizar cadastro</button>
      <p class="observacao">* Campos obrigatórios.</p>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
